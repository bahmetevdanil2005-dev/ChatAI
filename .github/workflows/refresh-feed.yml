name: Refresh freelance marketplace feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public RSS sources
        run: python scripts/fetch_marketplace_feed.py
      - name: Commit feed snapshot
        run: |
          if git diff --quiet -- public/data/jobs.json; then
            echo "Feed unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/jobs.json
          git commit -m "chore: refresh marketplace feed"
          git push
