<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой Claude</title>
<style>
:root{
  --bg:#f3f5f4;--surface:#ffffff;--ink:#16201c;--muted:#64706a;--line:#dde3e0;
  --me:#1f4d3f;--me-ink:#ffffff;--bot:#ffffff;--accent:#1f4d3f;--err:#b3261e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1513;--surface:#18201d;--ink:#e8eeeb;--muted:#8b9992;--line:#27312d;
  --me:#2f7a63;--me-ink:#fff;--bot:#18201d;--accent:#5fc0a0;--err:#ff8a80;color-scheme:dark;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
header h1{font-size:17px;margin:0;flex:1;font-weight:650}
header button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 11px;font:inherit;font-size:14px}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:5px}
.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:5px}
.err{align-self:center;color:var(--err);font-size:14px;text-align:center}
.hint{margin:auto;text-align:center;color:var(--muted);max-width:280px}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
textarea{flex:1;resize:none;max-height:140px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
#send{border:0;background:var(--accent);color:var(--bg);border-radius:14px;padding:0 16px;font:inherit;font-weight:650}
#send:disabled{opacity:.5}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);width:min(92vw,420px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
dialog input,dialog select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.row button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:9px 14px;font:inherit}
.row .primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:650}
small{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Мой Claude</h1>
  <button id="clear" type="button">Новый чат</button>
  <button id="cfg" type="button">Ключ</button>
</header>

<div id="log"><div class="hint" id="hint">Нажми «Ключ», вставь API-ключ и пиши.</div></div>

<form id="form">
  <textarea id="inp" rows="1" placeholder="Сообщение" enterkeyhint="send"></textarea>
  <button id="send" type="submit">Отправить</button>
</form>

<dialog id="dlg">
  <strong>Настройки</strong>
  <label for="key">API-ключ</label>
  <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="model">Модель</label>
  <input id="model" value="claude-opus-5-5" autocapitalize="off" spellcheck="false">
  <label for="sys">Системная инструкция (необязательно)</label>
  <input id="sys" placeholder="Отвечай по-русски, коротко">
  <p><small>Ключ хранится только в памяти этого браузера на твоём телефоне и уходит только на api.anthropic.com.</small></p>
  <div class="row">
    <button type="button" id="cancel">Закрыть</button>
    <button type="button" class="primary" id="save">Сохранить</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), inp = $('inp'), sendBtn = $('send'), dlg = $('dlg');
let history = [];
let busy = false;

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
function cfg(){ return { key: store('ck')||'', model: store('cm')||'claude-opus-5-5', sys: store('cs')||'' }; }

function add(cls, text){
  const h = $('hint'); if(h) h.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  if(cls==='err') d.className = 'err';
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

$('cfg').onclick = () => { const c = cfg(); $('key').value = c.key; $('model').value = c.model; $('sys').value = c.sys; dlg.showModal(); };
$('cancel').onclick = () => dlg.close();
$('save').onclick = () => {
  store('ck', $('key').value.trim()); store('cm', $('model').value.trim() || 'claude-opus-5-5'); store('cs', $('sys').value.trim());
  dlg.close();
};
$('clear').onclick = () => { history = []; log.innerHTML = '<div class="hint" id="hint">Новый чат. Пиши.</div>'; };

inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 140) + 'px'; });

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  const text = inp.value.trim(); if (!text) return;
  const c = cfg();
  if (!c.key) { $('cfg').click(); return; }

  inp.value = ''; inp.style.height = 'auto';
  add('me', text);
  history.push({ role: 'user', content: text });
  const out = add('bot', '…');
  busy = true; sendBtn.disabled = true;

  try {
    const body = { model: c.model, max_tokens: 4096, stream: true, messages: history };
    if (c.sys) body.system = c.sys;
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': c.key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify(body)
    });
    if (!r.ok) {
      let m = 'Ошибка ' + r.status;
      try { const j = await r.json(); if (j.error && j.error.message) m += ': ' + j.error.message; } catch(_){}
      throw new Error(m);
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', full = '';
    out.textContent = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const ln of lines) {
        if (!ln.startsWith('data:')) continue;
        const s = ln.slice(5).trim(); if (!s) continue;
        try {
          const j = JSON.parse(s);
          if (j.type === 'content_block_delta' && j.delta && j.delta.type === 'text_delta') {
            full += j.delta.text; out.textContent = full; log.scrollTop = log.scrollHeight;
          } else if (j.type === 'error') {
            throw new Error(j.error && j.error.message || 'Ошибка потока');
          }
        } catch (pe) { if (pe.message && !(pe instanceof SyntaxError)) throw pe; }
      }
    }
    if (!full) out.textContent = '(пустой ответ)';
    history.push({ role: 'assistant', content: full || '(пусто)' });
  } catch (err) {
    out.remove();
    history.pop();
    add('err', err.message || 'Не удалось отправить запрос');
  } finally {
    busy = false; sendBtn.disabled = false; inp.focus();
  }
});
</script>
</body>
</html>
